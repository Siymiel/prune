[project]
name = "prune-api"
version = "0.1.0"
description = "Prune AI workflow engine and Daraja/WhatsApp adapters"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "redis>=5.1.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30.0",
    "greenlet>=3.0.0",
    "anthropic>=0.39.0",
    "openai>=1.0.0",
    "voyageai>=0.3.0",
    "pinecone>=5.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "PyJWT[crypto]>=2.8.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "croniter>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
